name: Programa de PC (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/windows.yml"

permissions:
  contents: write   # publicar el .exe en la release "pc-latest"

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Copiar la web y descargar librerías (para que funcione sin internet)
        run: npm run preparar
      - name: Prueba automática SIN internet (modo local, cambio de modo, datos conservados)
        run: |
          SMOKE_OUT="$RUNNER_TEMP/smoke-dev.txt" npx electron . --smoke --no-sandbox || true
          cat "$RUNNER_TEMP/smoke-dev.txt"
          grep -q '"ok": true' "$RUNNER_TEMP/smoke-dev.txt"
      - name: Construir instalador y versión portable
        run: npx electron-builder --win --publish never
      - name: Probar el programa ya empaquetado
        run: |
          rm -f "$RUNNER_TEMP/smoke-pack.txt"
          SMOKE_OUT="$RUNNER_TEMP/smoke-pack.txt" "dist/win-unpacked/Registro Academico.exe" --smoke || true
          cat "$RUNNER_TEMP/smoke-pack.txt"
          grep -q '"ok": true' "$RUNNER_TEMP/smoke-pack.txt"
      - name: Publicar en la release pc-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release view pc-latest >/dev/null 2>&1 || gh release create pc-latest --title "Programa de PC (última versión)" --notes "Programa para Windows con modo online y modo local sin internet. Portable = un solo .exe sin instalación; Instalador = acceso directo y desinstalador." --latest=false
          gh release upload pc-latest dist/Registro-Academico-PC-Portable.exe dist/Registro-Academico-PC-Instalador.exe --clobber
