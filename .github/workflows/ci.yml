name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Verificación de tipos TypeScript
        run: npm run typecheck
      - name: Verificaciones estáticas (imports, referencias, secretos, RLS)
        run: python scripts/check.py
      - name: setup_completo.sql al día (generado desde schema + migraciones)
        run: |
          python scripts/build_setup.py
          git diff --exit-code supabase/setup_completo.sql
      - name: Pruebas SQL de seguridad (RLS, roles, instalación limpia) en PostgreSQL desechable
        run: python supabase/tests/run_tests.py
      - name: Tests unitarios (lógica pura)
        run: npm test
      - name: Construir imagen Docker
        run: docker build -t registro-academico:ci .
      - name: Probar contenedor (HTTP 200 + cabeceras de seguridad)
        run: |
          docker run -d --name ra -p 8080:80 registro-academico:ci
          for i in $(seq 1 15); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi "content-security-policy" headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/tests/tests.html)" = "404"

  android-nativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Comprobar si corresponde ejecutar tests nativos
        id: filtro
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            CAMBIOS=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^android-nativo/' || true)
            if [ -n "$CAMBIOS" ]; then
              echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            else
              echo "Sin cambios en android-nativo/. Omitiendo tests."
              echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-java@v4
        if: steps.filtro.outputs.ejecutar == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Asegurar SDK de Android (plataforma 37 + build-tools 37.0.0)
        if: steps.filtro.outputs.ejecutar == 'true'
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || echo "::warning::sdkmanager no pudo instalar android-37 o build-tools 37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.filtro.outputs.ejecutar == 'true'
        with:
          gradle-version: 9.6.0

      - name: Tests unitarios Android nativo (JVM)
        if: steps.filtro.outputs.ejecutar == 'true'
        working-directory: android-nativo
        run: gradle testDocenteDebugUnitTest --no-daemon
