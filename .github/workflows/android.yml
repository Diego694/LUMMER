name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write   # publicar el APK en la release "apk-latest"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # La web que abre el APK. Por defecto, la de GitHub Pages de este repo; se puede fijar con la variable de repo APP_URL.
      APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el SDK de Android; solo se asegura la plataforma y las build-tools que usa el proyecto.
      # (android-actions/setup-android@v3 falla con la imagen actual: "Failed to find package 'tools'".)
      - name: Asegurar SDK de Android (plataforma 34 + build-tools 34.0.0)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar clave de firma (si hay secretos)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave del proyecto."
          else
            echo "::warning::Sin secretos de firma: el APK se firma con una clave debug efímera y NO podrá actualizar una instalación anterior. Ver docs/ANDROID.md."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PAPP_URL="$APP_URL" -PAPP_VERSION_CODE="${{ github.run_number }}"

      - name: Renombrar y verificar
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk asistencia-escolar.apk
          ls -lh asistencia-escolar.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs asistencia-escolar.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: asistencia-escolar-apk
          path: asistencia-escolar.apk

      - name: Publicar enlace de descarga estable (release apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest asistencia-escolar.apk \
            --title "APK Android (última versión)" \
            --notes "Instala este APK en el teléfono. Se conecta a ${APP_URL} y se actualiza solo: no necesitas reinstalar cuando cambia la web. Compilación #${{ github.run_number }} · commit ${GITHUB_SHA::7}."
