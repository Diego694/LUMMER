name: App nativa (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-nativo/**"
      - ".github/workflows/android-nativo.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Asegurar SDK de Android (plataforma 37 + build-tools 37.0.0)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;37.0.0" || echo "::warning::sdkmanager no pudo instalar android-37 o build-tools 37.0.0 (se intentará continuar)"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Preparar clave de firma (si hay secretos)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf %s "$KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave del proyecto."
          else
            echo "::warning::Sin secretos de firma: el APK se firma con una clave debug efímera y NO podrá actualizar una instalación anterior. Ver docs/ANDROID.md."
          fi

      - name: Compilar APK y ejecutar tests unitarios
        working-directory: android-nativo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_REF="${{ github.ref_name }}"
            VERSION_NAME="${TAG_REF#v}"
          else
            VERSION_NAME="4.0.0"
          fi
          echo "Compilando con VERSION_CODE=$VERSION_CODE y VERSION_NAME=$VERSION_NAME"
          gradle testDocenteDebugUnitTest assembleDocenteRelease --no-daemon \
            -PAPP_VERSION_CODE="$VERSION_CODE" \
            -PAPP_VERSION_NAME="$VERSION_NAME"

      - name: Renombrar y verificar
        run: |
          cp android-nativo/app/build/outputs/apk/docente/release/app-docente-release.apk registro-academico.apk
          ls -lh registro-academico.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs registro-academico.apk | head -5
          else
            echo "::warning::apksigner no disponible"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: registro-academico
          path: registro-academico.apk

      - name: Publicar en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/release-notes/app-nativa.md "$RUNNER_TEMP/notas.md"
          printf '\n\nCompilación #%s · commit %s\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" >> "$RUNNER_TEMP/notas.md"
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest registro-academico.apk \
            --title "Registro Académico — app nativa (última versión)" \
            --notes-file "$RUNNER_TEMP/notas.md"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Publicando release oficial para el tag $TAG..."
            gh release view "$TAG" > /dev/null 2>&1 && gh release delete "$TAG" --yes || true
            gh release create "$TAG" registro-academico.apk \
              --title "Registro Académico $TAG — app nativa" \
              --notes-file .github/release-notes/app-nativa-tag.md \
              --latest
          fi
