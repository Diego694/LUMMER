server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    # Todo se revalida (ETag) para que cada cambio publicado llegue de inmediato a la web y al APK.
    location /assets/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
    location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; add_header Service-Worker-Allowed "/" always; }
    location = /manifest.webmanifest { include /etc/nginx/security-headers.conf; default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }

    # No exponer material de desarrollo
    location ~ ^/(tests|scripts|docs|supabase|android|legacy|\.github) { return 404; }
}
