<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Portal del estudiante: regístrate, sube tu foto y obtén tu carnet institucional con código QR para el control de asistencia.">
<meta name="theme-color" content="#16223D">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Mi Carnet Institucional</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316223D'/%3E%3Cpath d='M8 17l5 5 11-12' stroke='%23E8A33D' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="../assets/js/theme-init.js"></script>
<script src="../assets/js/compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/estudiante.css">
<link rel="stylesheet" href="../assets/css/diseno.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="../assets/js/estudiante/main.js"></script>
</head>
<body class="est">
<noscript><p style="padding:24px">Esta aplicación requiere JavaScript.</p></noscript>
<header class="est-top">
  <div class="brand"><div class="brand-mark">RA</div><div><strong>Mi Carnet Institucional</strong><small id="est-instituto">Portal del estudiante</small></div></div>
  <div class="top-right">
    <span class="chip chip-amber" id="est-demo" hidden>Modo demo</span>
    <button class="icon-only bordered" data-action="theme" aria-label="Cambiar tema"></button>
    <button class="icon-only bordered" id="est-logout" data-action="logout" aria-label="Cerrar sesión" hidden></button>
  </div>
</header>
<main id="est-root" class="est-main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
