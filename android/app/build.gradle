plugins {
    id 'com.android.application'
}

def appUrl = (findProperty('APP_URL') ?: 'https://TU-USUARIO.github.io/registro-academico/').toString()
if (!appUrl.endsWith('/')) appUrl += '/'
// Config remota (app-config.json): permite cambiar la URL de la web sin reinstalar si el dominio cambia.
def configUrl = (findProperty('CONFIG_URL') ?: 'https://raw.githubusercontent.com/Diego694/Sistema-de-control-de-asistencia/main/app-config.json').toString()

android {
    namespace 'app.registroacademico'
    compileSdk 34

    defaultConfig {
        minSdk 24            // Android 7+. Desde Android 10 se guarda en Descargas vía MediaStore; antes, en la carpeta propia de la app
        targetSdk 34
        buildConfigField 'String', 'CONFIG_URL', "\"${configUrl}\""
        versionCode = (findProperty('APP_VERSION_CODE') ?: '1').toString().toInteger()
        versionName = (findProperty('APP_VERSION_NAME') ?: '3.2.1').toString()
    }

    buildFeatures {
        buildConfig true
    }

    // Dos apps con la MISMA base nativa y distinta URL: se instalan a la vez en un teléfono.
    //  - docente:    panel completo (asistencia, QR/NFC, dashboard)      → <APP_URL>
    //  - estudiante: portal de registro, foto y carnet con QR           → <APP_URL>estudiante/
    flavorDimensions 'rol'
    productFlavors {
        docente {
            dimension 'rol'
            applicationId 'app.registroacademico'   // se conserva: así las instalaciones existentes se actualizan
            resValue 'string', 'app_name', 'LUMMER Lite'
            buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
            buildConfigField 'String', 'CONFIG_KEY', '"docente"'
        }
        estudiante {
            dimension 'rol'
            applicationId 'app.registroacademico.estudiante'
            resValue 'string', 'app_name', 'LUMMER Estudiante'
            buildConfigField 'String', 'APP_URL', "\"${appUrl}estudiante/\""
            buildConfigField 'String', 'CONFIG_KEY', '"estudiante"'
        }
    }

    // Firma estable: si hay keystore (CI con secretos o local) se firma con ella; si no, con la clave debug.
    // IMPORTANTE: para que un APK pueda actualizar a otro ya instalado, SIEMPRE debe firmarse con la misma clave.
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
