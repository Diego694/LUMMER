<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sin conexión</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#16223D;color:#E8ECF5;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:340px}
  .mark{width:64px;height:64px;border-radius:16px;background:#22335A;color:#E8A33D;display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 8px}p{color:#9AA7C6;font-size:14px;line-height:1.5;margin:0 0 22px}
  button{background:#E8A33D;color:#2A1B02;border:0;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700}
</style></head>
<body><div class="box">
  <div class="mark">&#9888;</div>
  <h1>No se pudo abrir la aplicación</h1>
  <p id="msg">Revisa tu conexión a internet e inténtalo de nuevo.</p>
  <button onclick="reintentar()">Reintentar</button>
</div>
<script>
  var m = new URLSearchParams(location.search).get('m');
  if (m) document.getElementById('msg').textContent = m + ' Revisa tu conexión e inténtalo de nuevo.';
  function reintentar(){ if (window.AndroidBridge) AndroidBridge.retry(); else history.back(); }
</script></body></html>
